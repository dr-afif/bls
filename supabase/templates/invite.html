<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept your BLS Course Companion invitation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #111827;
      background-color: #f9fafb;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 16px;
      color: #111827;
    }
    p {
      margin: 0 0 16px 0;
      color: #4b5563;
      font-size: 15px;
    }
    .button-container {
      margin: 24px 0;
    }
    .button {
      display: inline-block;
      background-color: #0f172a;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }
    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BLS Course Companion</h1>
    <p>You have been invited to join the BLS Course Companion platform.</p>
    <p>Click the button below to accept your invitation and set up your account password.</p>
    <div class="button-container">
      <a class="button" href="{{ .RedirectTo }}#/auth/callback?token_hash={{ .TokenHash }}&type=invite">Accept Invitation</a>
    </div>
    <div class="footer">
      <p>If you did not expect this invitation, you can safely ignore this email.</p>
    </div>
  </div>
</body>
</html>
